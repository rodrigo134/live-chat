<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link href="/main.css" rel="stylesheet">


    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="/app.js"></script>
</head>
<body>

<noscript>
    <h2 style="color:red">
        Your browser does not support JavaScript. Enable JS and reload.
    </h2>
</noscript>

<div id="main-content" class="container">

    <div class="row">
        <div class="col-md-12 text-center">
            <h2 style="font-weight: bold; color: #ffffff;">Live Chat</h2>
        </div>
    </div>

    <!-- USER + MESSAGE + CONNECT -->
    <div class="row">
        <div class="col-md-6">
            <form id="chat-form" class="form-inline">
                <div class="form-group">
                    <label for="user">Username:</label>
                    <input type="text" id="user" class="form-control" placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <input type="text" id="message" class="form-control" placeholder="Type your message...">
                </div>

                <button id="send" class="btn btn-primary" type="submit">Send</button>
            </form>
        </div>

        <div class="col-md-6 text-right">
            <button id="connect" class="btn btn-success">Connect</button>
            <button id="disconnect" class="btn btn-danger" disabled>Disconnect</button>
        </div>
    </div>

    <!-- MESSAGE TABLE -->
    <div class="row">
        <div class="col-md-12">
            <table id="conversation" class="table table-striped">
                <thead>
                <tr>
                    <th>Live Chat</th>
                </tr>
                </thead>
                <tbody id="livechat">
                <!-- Messages will appear here -->
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
